name: Frontend CI/CD

# Despliega frontend/ en Cloudflare Pages (proyecto urlshortener-web, cuenta Exeal):
# push a main -> producción (admin.exeal.com); PR -> preview en <rama>.urlshortener-web.pages.dev.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-deploy.yml'
      - 'frontend/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-deploy.yml'
      - 'frontend/**'

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Los PRs desde forks no tienen acceso a los secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # @exeal/design está en un repo privado: token de solo lectura sobre exeal-es/exeal-design.
      - name: Allow access to exeal-design
        env:
          TOKEN: ${{ secrets.EXEAL_DESIGN_TOKEN }}
        run: |
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/exeal-es/exeal-design".insteadOf "ssh://git@github.com/exeal-es/exeal-design"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_OIDC_AUTHORITY: ${{ vars.REACT_APP_OIDC_AUTHORITY }}
          REACT_APP_OIDC_CLIENT_ID: ${{ vars.REACT_APP_OIDC_CLIENT_ID }}
          REACT_APP_OIDC_ORG_ID: ${{ vars.REACT_APP_OIDC_ORG_ID }}
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy build --project-name=urlshortener-web --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview frontend: $URL"
